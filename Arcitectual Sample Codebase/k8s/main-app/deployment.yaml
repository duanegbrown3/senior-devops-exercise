apiVersion: apps/v1
kind: Deployment

metadata:
  name: main-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: main-app

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: main-app

    spec:
      containers:

        - name: main-app

          image: ${ACR_NAME}.azurecr.io/main-app:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: CASSANDRA_HOST
              value: cassandra

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20