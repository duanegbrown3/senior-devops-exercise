apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: devops-exercise
  namespace: argocd

spec:

  description: Senior DevOps Exercise

  sourceRepos:
    - "*"

  destinations:
    - namespace: default
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"