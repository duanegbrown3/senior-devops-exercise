apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: auth-service

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: acrdevopsdemo.azurecr.io/auth-service:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_HOST
              value: postgres

            - name: DATABASE_NAME
              value: authdb

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10